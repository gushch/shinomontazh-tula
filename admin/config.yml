# Вход через GitHub. Замените ВАШ_ЛОГИН на логин владельца репозитория.
backend:
  name: github
  repo: gushch/shinomontazh-tula
  branch: main

# Для проверки на своём компьютере: npx decap-server, затем http://localhost:.../admin/
local_backend: true

locale: ru

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: settings
    label: Сайт
    editor:
      preview: false
    files:
      - name: site
        label: Цены, точки и контакты
        file: content/site.json
        # Поля идут в том же порядке, что и блоки на сайте
        fields:
          # Услуги и цены
          - label: Подпись под ценами
            name: prices_note
            widget: string
            required: false

          - label: Цены
            name: prices
            widget: list
            summary: '{{fields.name}} — {{fields.price}}'
            fields:
              - { label: Услуга, name: name, widget: string }
              - { label: Пояснение мелким шрифтом, name: note, widget: string, required: false }
              - { label: Цена, name: price, widget: string, hint: 'Например 250 ₽, 1 000–4 000 ₽ или по запросу' }

          - label: Дополнительные услуги (без цен)
            name: extras
            widget: list
            field: { label: Услуга, name: item, widget: string }

          # Онлайн-запись
          - label: Услуги в форме записи
            name: booking_services
            widget: list
            field: { label: Услуга, name: item, widget: string }

          - label: WhatsApp для заявок
            name: whatsapp
            widget: string
            hint: Сюда приходят заявки с сайта. Только цифры, 11 штук, начиная с 7. Например 79051895895
            pattern: ['^7\d{10}$', 'Нужно 11 цифр, первая — 7, без пробелов и плюса']

          # Преимущества
          - label: Карточки преимуществ
            name: features
            widget: list
            summary: '{{fields.title}}'
            hint: Удалите все карточки, чтобы скрыть блок
            fields:
              - { label: Заголовок, name: title, widget: string }
              - { label: Текст, name: text, widget: string, required: false }

          # Фото
          - label: Фотографии
            name: photos
            widget: list
            summary: '{{fields.alt}}'
            hint: Блок появится на сайте, когда добавите первое фото
            fields:
              - { label: Фото, name: image, widget: image }
              - { label: Подпись, name: alt, widget: string, required: false }

          # Контакты
          - label: Точки
            name: points
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: Короткое название, name: title, widget: string, hint: 'Например ул. Вильямса' }
              - { label: Полный адрес, name: address, widget: string }
              - { label: Часы работы, name: hours, widget: string }
              - { label: Особые часы, name: hours_extra, widget: string, required: false, hint: 'Например Ноябрь и декабрь: 9:00–00:00. Оставьте пустым, если не нужно' }
              - { label: Ссылка на Яндекс Карты, name: map, widget: string, required: false }

          - label: Телефон на сайте
            name: phone
            widget: string
            hint: Показывается в шапке и в контактах, например +7 (905) 189-58-95
